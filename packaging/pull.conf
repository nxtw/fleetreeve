# Settings of the fleetreeve pull client (fleetreeve-pull.service).
#
# Normally written for you by `fleetreeve install` or `fleetreeve enroll`; edit by
# hand only if you manage the token in /etc/fleetreeve/token yourself, then
#   systemctl enable --now fleetreeve-pull
#
#FLEETREEVE_SERVER="https://fleetreeve.example.com:8140"
#FLEETREEVE_HOST="web1"                       # name in the inventory; default: short hostname
#FLEETREEVE_TOKEN_FILE=/etc/fleetreeve/token
#FLEETREEVE_EVERY=30m
#FLEETREEVE_CA=/etc/fleetreeve/ca.pem              # only for a private CA
